<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live visual tutor</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#12161c;color:#eceff1;font-family:system-ui,sans-serif}
  #canvas{display:block;width:100vw;height:100vh}
  #status{position:fixed;top:10px;left:12px;color:#8b98a8;font-size:12px}
  #caption{position:fixed;left:0;right:0;bottom:0;min-height:26px;padding:14px 20px;background:rgba(10,12,16,.72);font-size:18px;line-height:1.45}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="status">connecting...</div>
<div id="caption" aria-live="polite"></div>
<script>
const canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d");
const statusEl=document.getElementById("status"),captionEl=document.getElementById("caption");
const objects={},slots=[[.2,.3],[.52,.26],[.78,.4],[.3,.6],[.62,.62]];let slot=0;
function resize(){canvas.width=innerWidth;canvas.height=innerHeight} resize(); addEventListener("resize",resize);
function addObject(command,snapshot){const object={...command};if(object.x==null){const p=slots[slot++%slots.length];object.x=p[0];object.y=p[1]}object.born=snapshot?0:performance.now();objects[object.id]=object}
function connect(){const protocol=location.protocol==="https:"?"wss":"ws",socket=new WebSocket(`${protocol}://${location.host}/ws`);socket.onopen=()=>statusEl.textContent="connected";socket.onclose=()=>{statusEl.textContent="reconnecting...";setTimeout(connect,1000)};socket.onmessage=event=>{const message=JSON.parse(event.data),now=performance.now();if(message.type==="snapshot")(message.objects||[]).forEach(command=>addObject(command,true));if(message.type==="caption")captionEl.textContent=message.text;if(message.type!=="scene")return;const command=message.cmd;if(command.op==="draw")addObject(command);else if(command.op==="erase"){Object.values(objects).filter(object=>command.id==="*"||object.id===command.id).forEach(object=>{object.dying=true;object.dieT=now})}else if(command.op==="highlight"&&objects[command.id])objects[command.id].highlight={color:command.color,time:now};else if(command.op==="animate"&&objects[command.id])objects[command.id].animation={...command,time:now}}} connect();
function drawBoard(){ctx.fillStyle="#12161c";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle="rgba(255,255,255,.05)";for(let x=20;x<canvas.width;x+=40)for(let y=20;y<canvas.height;y+=40)ctx.fillRect(x,y,2,2)}
function drawObject(object,now){let dx=0,dy=0,scale=1,glow=0;const animation=object.animation;if(animation){const phase=(now-animation.time)/Math.max(1,animation.dur)*Math.PI*2,wave=Math.sin(phase);if(animation.motion==="move"){dx=animation.dx*wave;dy=animation.dy*wave}else if(animation.motion==="rays")glow=1;else scale=1+.05*wave}if(object.highlight&&now-object.highlight.time<2600)glow=1;ctx.save();ctx.translate(object.x*canvas.width+dx,object.y*canvas.height+dy);ctx.scale(scale,scale);if(glow){ctx.shadowColor=object.highlight?.color||object.fill||"#ffee58";ctx.shadowBlur=18+10*Math.sin(now/120)}ctx.globalAlpha=object.alpha??1;ctx.fillStyle=object.fill;ctx.strokeStyle=object.stroke||object.fill;ctx.lineWidth=3;if(object.shape==="circle"){ctx.beginPath();ctx.arc(0,0,34,0,Math.PI*2);ctx.fill();if(animation?.motion==="rays")for(let i=0;i<8;i++){const angle=i/8*Math.PI*2+now/900,radius=44+12*Math.sin(now/300+i);ctx.beginPath();ctx.moveTo(Math.cos(angle)*40,Math.sin(angle)*40);ctx.lineTo(Math.cos(angle)*radius,Math.sin(angle)*radius);ctx.stroke()}}else if(object.shape==="ellipse"){ctx.beginPath();ctx.ellipse(0,0,72,42,0,0,Math.PI*2);ctx.fill()}else if(object.shape==="arrow"){ctx.beginPath();ctx.moveTo(-56,0);ctx.lineTo(56,0);ctx.stroke();ctx.beginPath();ctx.moveTo(56,0);ctx.lineTo(38,-12);ctx.moveTo(56,0);ctx.lineTo(38,12);ctx.stroke()}else if(object.shape==="label"){ctx.font="500 22px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(object.text||"",0,0)}else{ctx.beginPath();if(ctx.roundRect)ctx.roundRect(-48,-32,96,64,10);else ctx.rect(-48,-32,96,64);ctx.fill()}ctx.restore()}
function loop(){const now=performance.now();drawBoard();for(const id in objects){const object=objects[id];let alpha=object.born===0?1:Math.min(1,(now-object.born)/400);if(object.dying){const remaining=1-(now-object.dieT)/300;if(remaining<=0){delete objects[id];continue}alpha*=Math.max(0,remaining)}object.alpha=alpha;drawObject(object,now)}requestAnimationFrame(loop)} loop();
</script>
</body>
</html>
